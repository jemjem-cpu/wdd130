<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | WhiteWater Rafting</title>
    <meta name="description"
      content="Have questions or ready to book your river adventure? Contact our expert guides today for whitewater rafting bookings, group rates, and trip details.">
    <meta name="author" content="Jeremiah Gwyn Agoot">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

    <header>
        <img src="images/logo.png" alt="rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>
        </section>

        <section class="contact-main">
            <iframe title="Map of White Water Rafting Company"
              src="https://www.google.com/maps?q=37.4220,-122.0841&amp;z=14&amp;output=embed"
              loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

            <form>
                <div class="form-item">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Name" required>
                </div>

                <div class="form-item">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="hello@gmail.com"
                      required>
                </div>

                <fieldset class="form-item">
                    <legend>Message Purpose</legend>
                    <div class="options">
                        <label><input type="radio" name="purpose" value="general" checked> General
                            Inquiry</label>
                        <label><input type="radio" name="purpose" value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" name="purpose" value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </fieldset>

                <div class="form-item stacked">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"
                      required></textarea>
                </div>

                <div class="form-item stacked">
                    <label>
                        <input type="checkbox" name="newsletter" value="yes">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>

        <section class="team">
            <h2>We Are Here to Serve You</h2>
            <div class="team-content">
                <figure>
                    <img src="images/employee-1.jpg" alt="Head river guide">
                    <figcaption>Head River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-2.jpg" alt="Operations manager">
                    <figcaption>Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee-3.jpg" alt="Customer service representative">
                    <figcaption>Customer Service Representative</figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026. White Water Rafting. Jeremiah Gwyn Agoot</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
            <a href="https://www.tiktok.com">
                <img src="images/tiktok.png" alt="Tiktok Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
