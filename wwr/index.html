<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | WhiteWater Rafting</title>
    <meta name="description"
      content="Experience thrilling whitewater rafting with expert guides, quality gear, and trips for every skill level. Book your adventure with WhiteWater Rafting today.">
    <meta name="author" content="Jeremiah Gwyn Agoot">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body class="home">

    <header>
        <img src="images/logo.png" alt="rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
        <div class="hero">
            <img src="images/home-hero.webp" alt="rafting group">
            <div class="hero-cta">
                <h1>Ready for the Ride of Your Life?</h1>
                <a href="trips.html">Explore Our Trips</a>
            </div>
        </div>

        <section class="offerings">
            <h2>Why Raft With Us</h2>
            <div class="offerings-grid">
                <figure>
                    <img src="images/rafting-1.webp" alt="Yellow raft crossing turquoise rapids">
                    <figcaption>
                        <h3>Rapids for Every Skill Level</h3>
                        <p>From gentle family floats to heart-pounding whitewater, we have a trip that fits your
                            experience and your sense of adventure.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-2.webp" alt="Smiling rafting group posing on their raft">
                    <figcaption>
                        <h3>Expert Guides and Top Gear</h3>
                        <p>Our certified guides lead every trip, and we provide quality helmets, life jackets and
                            paddles so you can focus on the fun.</p>
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/rafting-3.webp" alt="Rafters on a river through a forested canyon">
                    <figcaption>
                        <h3>Unforgettable Scenery</h3>
                        <p>Our mission is to share the thrill of the river while exploring beautiful canyons and
                            wild landscapes you can only reach by water.</p>
                    </figcaption>
                </figure>
            </div>
        </section>

        <section class="newsletter">
            <h2>Join Our Newsletter</h2>
            <p>Get trip updates, river conditions and special offers delivered to your inbox.</p>
            <form>
                <div class="form-item">
                    <label for="newsletter-name">Name</label>
                    <input type="text" id="newsletter-name" name="name" placeholder="Name" required>
                </div>
                <div class="form-item">
                    <label for="newsletter-email">Email</label>
                    <input type="email" id="newsletter-email" name="email"
                      placeholder="hello@gmail.com" required>
                </div>
                <button type="submit">Sign Up</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026. White Water Rafting. Jeremiah Gwyn Agoot</p>
        <nav class="socialmedia">
            <a href="https://www.facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://www.instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
            <a href="https://www.tiktok.com">
                <img src="images/tiktok.png" alt="Tiktok Icon">
            </a>
        </nav>
    </footer>

</body>

</html>
