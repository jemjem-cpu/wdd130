<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>

    <main>
        <h1>HTML and CSS Quiz</h1>
        <form>
            <fieldset>
                <label for="q1">What does the acronym CSS stands for?</label>
                <input type="text" id="q1" name="q1" required>

                <label for="q2">How are id and class attributes selected in CSS?</label>
                <textarea name="q2" id="q2" rows="3"></textarea>

                <label for="q3">Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3"">
                    <option value="" disabled selected>Choose One ...</option>
                    <option value=" 1">/* Hello */</option>
                    <option value="2">*/ Hello /*</option>
                    <option value="3">% Hello %</option>
                </select>


                <label for="q4">What is the optimal font size for a body in px?</label>
                <input type="number" id="q4" name="q4">

            </fieldset>


            <button type="submit">Submit Quiz</button>
        </form>

    </main>

</body>

</html>
